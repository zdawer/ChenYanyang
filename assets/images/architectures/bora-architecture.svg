<path id="formal-correct" d="M431 454 H472" fill="none" stroke="#8190A3" stroke-width="2.3" stroke-linejoin="round"  />
<path id="correct-fit" d="M679 454 H719" fill="none" stroke="#8190A3" stroke-width="2.3" stroke-linejoin="round"  />
