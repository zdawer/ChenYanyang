<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">replay-architecture</title><desc id="desc">Source: replay manuscript abstract, outer-block estimand and fresh-reroll workflow. Candidates are evaluated over k selection realizations; selected decisions are frozen and evaluated on R fresh rerolls. Rerolls are averaged within each of B complete independent blocks before paired inference.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8190A3"/></marker><marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#469584"/></marker></defs><rect width="960" height="600" fill="#FFFFFF"/><g font-family="Helvetica"><text font-family="Helvetica" x="32" y="44" text-anchor="start" font-size="28" font-weight="650" fill="#20334D">Evaluate the complete replay selector</text>
<text font-family="Helvetica" x="32" y="77" text-anchor="start" font-size="19" font-weight="400" fill="#67758A">Fresh-reroll audit at the level of independent selection procedures.</text>
<g id="outer-block"><rect x="28" y="114" width="904" height="323" rx="12" fill="#FFFFFF" stroke="#DCE3EB" stroke-width="1.7" stroke-dasharray="7 6"/></g>
<text font-family="Helvetica" x="48" y="146" text-anchor="start" font-size="20" font-weight="600" fill="#67758A">Repeat the complete procedure across B outer blocks</text>
<g id="candidates"><rect x="52" y="197" width="177" height="90" rx="9" fill="#F4F6F9" stroke="#DCE3EB" stroke-width="1.6"/>
<text font-family="Helvetica" x="140.5" y="235" text-anchor="middle" font-size="25" font-weight="600" fill="#20334D">Candidate</text>
<text font-family="Helvetica" x="140.5" y="265" text-anchor="middle" font-size="21" font-weight="400" fill="#67758A">replay decisions</text>
</g>
<g id="select"><rect x="281" y="197" width="186" height="90" rx="9" fill="#E7F3F0" stroke="#469584" stroke-width="1.6"/>
<text font-family="Helvetica" x="374" y="235" text-anchor="middle" font-size="25" font-weight="600" fill="#20334D">Run selector</text>
<text font-family="Helvetica" x="374" y="265" text-anchor="middle" font-size="21" font-weight="400" fill="#67758A">k realizations</text>
</g>
<g id="freeze"><rect x="519" y="197" width="165" height="90" rx="9" fill="#EAF1FA" stroke="#6487B3" stroke-width="1.6"/>
<text font-family="Helvetica" x="601.5" y="235" text-anchor="middle" font-size="25" font-weight="600" fill="#20334D">Freeze</text>
<text font-family="Helvetica" x="601.5" y="265" text-anchor="middle" font-size="21" font-weight="400" fill="#67758A">the winner</text>
</g>
<g id="reroll"><rect x="737" y="197" width="169" height="90" rx="9" fill="#EAF1FA" stroke="#6487B3" stroke-width="1.6"/>
<text font-family="Helvetica" x="821.5" y="235" text-anchor="middle" font-size="23.9" font-weight="600" fill="#20334D">Fresh rerolls</text>
<text font-family="Helvetica" x="821.5" y="265" text-anchor="middle" font-size="21" font-weight="400" fill="#67758A">R disjoint runs</text>
</g>
<path id="candidate-select" d="M229 242 H281" fill="none" stroke="#8190A3" stroke-width="2.3" stroke-linejoin="round"  />
<path id="select-freeze" d="M467 242 H519" fill="none" stroke="#8190A3" stroke-width="2.3" stroke-linejoin="round"  />
<path id="freeze-reroll" d="M684 242 H737" fill="none" stroke="#8190A3" stroke-width="2.3" stroke-linejoin="round"  />
<g id="block-mean"><rect x="622" y="338" width="284" height="66" rx="9" fill="#FBF2E2" stroke="#C8A369" stroke-width="1.6"/>
<text font-family="Helvetica" x="764" y="379" text-anchor="middle" font-size="25" font-weight="600" fill="#20334D">Average within block</text>
</g>
<path id="reroll-mean" d="M821 287 V338" fill="none" stroke="#8190A3" stroke-width="2.3" stroke-linejoin="round"  />
<g id="inference"><rect x="304" y="482" width="352" height="78" rx="9" fill="#E7F3F0" stroke="#469584" stroke-width="1.6"/>
<text font-family="Helvetica" x="480" y="514" text-anchor="middle" font-size="25" font-weight="600" fill="#20334D">Paired inference</text>
<text font-family="Helvetica" x="480" y="544" text-anchor="middle" font-size="21" font-weight="400" fill="#67758A">Across independent blocks</text>
</g>
<path id="blocks-inference" d="M764 404 V521 H656" fill="none" stroke="#8190A3" stroke-width="2.3" stroke-linejoin="round"  />
<text font-family="Helvetica" x="305" y="365" text-anchor="middle" font-size="18" font-weight="400" fill="#67758A">Repeat selection, not only deployment</text><polygon points="281,242 271,247 271,237" fill="#8190A3"/><polygon points="519,242 509,247 509,237" fill="#8190A3"/><polygon points="737,242 727,247 727,237" fill="#8190A3"/><polygon points="821,338 816,328 826,328" fill="#8190A3"/><polygon points="656,521 666,516 666,526" fill="#8190A3"/></g></svg>