short_bio_text_justify: false
short_bio: >-
  <p>
    I am an undergraduate researcher in <strong>Applied Mathematics at Guangzhou University</strong>
    (B.Sc. expected 2028). My research connects mathematical modeling and machine learning
    with problems in adaptive intelligence, biological systems, and sustainable materials.
  </p>
  <p>
    In machine learning, I study <strong>continual learning, replay evaluation, and fraud detection</strong>
    under class imbalance and concept drift. I also work on <strong>co-adaptive brain-computer
    interfaces for multi-drone control</strong>. In interdisciplinary research, I investigate plant
    epigenetics, multi-omics, and the valorization of agricultural by-products.
  </p>
  <p>
    I am the first author of an <strong>IROS 2026 accepted paper</strong> and will give an
    <strong>oral presentation in Pittsburgh, USA</strong>. Two of my first-author manuscripts
    on continual replay are <strong>under review at AAAI 2027</strong>. My research also includes
    a 2026 study in <em>Industrial Crops &amp; Products</em> and manuscripts under review at PNAS and KDD.
  </p>
  <p>
    I lead a <strong>national-level Undergraduate Innovation and Entrepreneurship Training Program
    project (国家级大学生创新创业训练计划)</strong> and a Guangdong Provincial Climbing Plan project.
    I also participate in research supported by an <strong>NSFC General Program
    (国家自然科学基金面上项目)</strong>.
  </p>
  <p class="mb-0">
    I welcome research collaborations and internship opportunities in machine learning,
    brain-computer interfaces, and computational biology.
  </p>

