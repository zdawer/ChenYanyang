<dialog class="figure-viewer" id="figure-viewer" aria-labelledby="figure-viewer-title" aria-describedby="figure-viewer-caption figure-viewer-disclosure">
  <div class="figure-viewer-header">
    <div>
      <p class="figure-viewer-kicker" id="figure-viewer-caption"></p>
      <h2 id="figure-viewer-title">Research figure</h2>
    </div>
    <button class="figure-viewer-close" type="button" aria-label="Close figure" autofocus><span aria-hidden="true">×</span></button>
  </div>
  <div class="figure-viewer-stage">
    <img id="figure-viewer-image" alt="" decoding="async">
    <p class="figure-viewer-error" role="status" hidden>The preview could not be loaded. You can open the full-resolution image below.</p>
  </div>
  <div class="figure-viewer-footer">
    <div class="figure-viewer-description">
      <p id="figure-viewer-note" hidden></p>
      <p id="figure-viewer-disclosure">AI-generated illustrative concept; not an original paper figure or a validated experimental result.</p>
    </div>
    <a id="figure-viewer-original" href="#" target="_blank" rel="noopener">Open full resolution <span aria-hidden="true">↗</span></a>
  </div>
</dialog>
