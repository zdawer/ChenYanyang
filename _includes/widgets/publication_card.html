{% assign publications = include.publications %}
<section id="research" class="research-section my-4" aria-labelledby="research-heading">
  <div class="research-section-header">
    <div><p class="section-kicker">Research</p><h2 id="research-heading">Selected publications &amp; manuscripts</h2></div>
    <a href="{{ 'publications' | relative_url }}">All publications <span aria-hidden="true">↗</span></a>
  </div>
  {% for item in publications limit:include.limit %}
    {% include widgets/publication_item.html item=item first=false last=false hide_bottom_border=forloop.last %}
  {% endfor %}
</section>
